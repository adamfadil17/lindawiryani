# Install at /etc/nginx/sites-available/lindawiryani, then:
#   ln -s /etc/nginx/sites-available/lindawiryani /etc/nginx/sites-enabled/lindawiryani
#   nginx -t && systemctl reload nginx
#
# Replace every lindawiryani.com below. Both sites in one file: main and beta.lindawiryani.com. The ports
# must match `port=` in deploy.sh; the certificate must list both names
#   certbot --nginx -d lindawiryani.com -d www.lindawiryani.com -d beta.lindawiryani.com
# Beta is protected with HTTP basic auth: create the password file once with
#   htpasswd -c /etc/nginx/.htpasswd-lindawiryani-beta team

map $host $lw_upstream { beta.lindawiryani.com 127.0.0.1:18191; default 127.0.0.1:18190; }
# Beta is a staging copy on the live database: keep it out of search engines.
map $host $lw_robots   { beta.lindawiryani.com "noindex, nofollow"; default ""; }
map $host $lw_beta_auth { beta.lindawiryani.com "Lindawiryani beta"; default off; }
map $host $lw_canonical { www.lindawiryani.com lindawiryani.com; default $host; }

# Rate limits: the key is the client IP only for the endpoint being throttled, "" otherwise.
map "$request_method:$uri" $lw_login_key  { "POST:/api/auth/login" $binary_remote_addr; default ""; }
map "$request_method:$uri" $lw_mail_key   { "POST:/api/send-email"  $binary_remote_addr; default ""; }
map "$request_method:$uri" $lw_upload_key { "POST:/api/upload"      $binary_remote_addr; default ""; }
map "$request_method:$uri" $lw_api_key    { ~:/api/ $binary_remote_addr; default ""; }

limit_req_zone $lw_login_key  zone=lwy_login:1m  rate=10r/m;
limit_req_zone $lw_mail_key   zone=lwy_mail:1m   rate=5r/m;
limit_req_zone $lw_upload_key zone=lwy_upload:1m rate=30r/m;
limit_req_zone $lw_api_key    zone=lwy_api:10m   rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name lindawiryani.com www.lindawiryani.com beta.lindawiryani.com;
    return 301 https://$lw_canonical$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lindawiryani.com;

    ssl_certificate     /etc/letsencrypt/live/lindawiryani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindawiryani.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lindawiryani.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lindawiryani.com beta.lindawiryani.com;

    ssl_certificate     /etc/letsencrypt/live/lindawiryani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindawiryani.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 10m;           # uploads are capped at 5 MB by the app
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag              $lw_robots always;

    # Dotfiles and VCS folders: nothing legitimate lives here.
    location ~ /\.(?!well-known) { return 404; }

    location / {
        auth_basic           $lw_beta_auth;
        auth_basic_user_file /etc/nginx/.htpasswd-lindawiryani-beta;

        limit_req zone=lwy_login  burst=5   nodelay;
        limit_req zone=lwy_mail   burst=3   nodelay;
        limit_req zone=lwy_upload burst=10  nodelay;
        limit_req zone=lwy_api    burst=100 nodelay;

        proxy_pass http://$lw_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next skips its proxy for requests claiming to be internal subrequests; never forward it.
        proxy_set_header x-middleware-subrequest "";
        proxy_read_timeout 60s;
    }
}
