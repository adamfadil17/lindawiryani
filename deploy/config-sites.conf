# Install at /etc/nginx/sites-available/lindawiryani-app (the name "lindawiryani" is taken by the
# older dashboard.lindawiryani.com site on this server), then:
#   ln -s /etc/nginx/sites-available/lindawiryani-app /etc/nginx/sites-enabled/lindawiryani-app
#   nginx -t && systemctl reload nginx
#
# Only beta.lindawiryani.com is served for now, because lindawiryani.com's DNS does not point at
# this server yet. To add main later, add a server block like the beta one with server_name
# lindawiryani.com / www and `proxy_pass http://127.0.0.1:18190`, plus its own certificate.
#
# Certificate (webroot, so nginx keeps running):
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d beta.lindawiryani.com
# Beta is password-protected by the app itself (TEAM_ACCESS_* in app.env), not by nginx.
#
# Variable and zone names use the prefix lwy_ so they never clash with other sites' configs.

# Rate limits: the key is the client IP only for the endpoint being throttled, "" otherwise.
map "$request_method:$uri" $lwy_login_key  { "POST:/api/auth/login" $binary_remote_addr; default ""; }
map "$request_method:$uri" $lwy_mail_key   { "POST:/api/send-email"  $binary_remote_addr; default ""; }
map "$request_method:$uri" $lwy_upload_key { "POST:/api/upload"      $binary_remote_addr; default ""; }
map "$request_method:$uri" $lwy_api_key    { ~:/api/ $binary_remote_addr; default ""; }

limit_req_zone $lwy_login_key  zone=lwy_login:1m  rate=10r/m;
limit_req_zone $lwy_mail_key   zone=lwy_mail:1m   rate=5r/m;
limit_req_zone $lwy_upload_key zone=lwy_upload:1m rate=30r/m;
limit_req_zone $lwy_api_key    zone=lwy_api:10m   rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name beta.lindawiryani.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.lindawiryani.com;

    ssl_certificate     /etc/letsencrypt/live/beta.lindawiryani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.lindawiryani.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 10m;           # uploads are capped at 5 MB by the app
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Beta is a staging copy on the live database: keep it out of search engines.
    add_header X-Robots-Tag              "noindex, nofollow" always;

    # Dotfiles and VCS folders: nothing legitimate lives here.
    location ~ /\.(?!well-known) { return 404; }

    location / {
        limit_req zone=lwy_login  burst=5   nodelay;
        limit_req zone=lwy_mail   burst=3   nodelay;
        limit_req zone=lwy_upload burst=10  nodelay;
        limit_req zone=lwy_api    burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:18191;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next skips its proxy for requests claiming to be internal subrequests; never forward it.
        proxy_set_header x-middleware-subrequest "";
        proxy_read_timeout 60s;
    }
}
